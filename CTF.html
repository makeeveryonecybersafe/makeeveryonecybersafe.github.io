<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Challenge | MECS</title>
    <style>
        :root {
            --mecs-pink: #ff0055;
            --mecs-dark: #0a0a0a;
            --mecs-card: #151515;
            --mecs-text: #ffffff;
            --mecs-grid: rgba(255, 0, 85, 0.05);
        }

        body {
            background-color: var(--mecs-dark);
            background-image: 
                linear-gradient(var(--mecs-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--mecs-grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--mecs-text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .submission-card {
            background: var(--mecs-card);
            border-left: 4px solid var(--mecs-pink);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .header-tag {
            color: var(--mecs-pink);
            text-transform: uppercase;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        h1 { font-size: 2.2rem; margin: 0 0 10px 0; text-transform: uppercase; font-weight: 800; }
        p { color: #888; margin-bottom: 25px; font-size: 0.95rem; }

        /* Hints Section */
        .hints-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .frag-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--mecs-pink);
            padding: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .frag-btn:hover { border-color: var(--mecs-pink); background: #222; }

        #hint-display {
            background: #000;
            border: 1px dashed #444;
            padding: 15px;
            margin-bottom: 25px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #ccc;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        /* Input Section */
        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            color: white;
            font-family: monospace;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button.submit-btn {
            background: var(--mecs-pink);
            color: white;
            border: none;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 90% 100%, 0 100%);
        }

        #status { margin-top: 20px; font-weight: bold; text-align: center; font-size: 0.9rem; }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
    </style>
</head>
<body>

<div class="container">
    <div class="submission-card">
        <span class="header-tag">● FLAG SUBMISSION</span>
        <h1>TRACE CHALLENGE</h1>
        <p>Analyze the fragments and enter the final flag to receive your badge.</p>

        <div class="hints-grid">
            <button class="frag-btn" onclick="showHint(1)">Frag 1</button>
            <button class="frag-btn" onclick="showHint(2)">Frag 2</button>
            <button class="frag-btn" onclick="showHint(3)">Frag 3</button>
            <button class="frag-btn" onclick="showHint(4)">Frag 4</button>
            <button class="frag-btn" onclick="showHint(5)">Frag 5</button>
            <button class="frag-btn" onclick="showHint(6)">Frag 6</button>
        </div>
        
        <div id="hint-display">Select a fragment to reveal hint...</div>

        <input type="text" id="flagInput" placeholder="MECS{final_flag_here}">
        <button class="submit-btn" onclick="validateFlag()">Validate Flag</button>
        
        <div id="status"></div>
    </div>
</div>

    async function hashFlag(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function validateFlag() {
        const input = document.getElementById('flagInput').value.trim();
        const status = document.getElementById('status');
        const hashedInput = await hashFlag(input);

        if (hashedInput === CHALLENGE_HASH) {
            status.innerHTML = '<span class="success">ACCESS GRANTED. Downloading Badge...</span>';
            const link = document.createElement('a');
            link.href = BADGE_DATA;
            link.download = 'MECS_Trace_Badge.png';
            link.click();
        } else {
            status.innerHTML = '<span class="error">INVALID FLAG. TRACE TERMINATED.</span>';
        }
    }
</script>
