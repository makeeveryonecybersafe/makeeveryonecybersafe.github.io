<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Events - MakeEveryoneCyberSafe</title>
  <style>@view-transition { navigation: auto; }</style>
  <style>
    /* --- 1. THE CRITICAL FIX FOR HORIZONTAL SCROLL --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #000000;
      --surface-color: #0a0a0a;
      --text-color: #ffffff;
      --primary: #FF0055;
      --grid-color: #151515;
      --completed: #555555; /* Gray for completed state */
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- HEADER --- */
    .header {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--primary);
      width: 100%;
    }

    .nav-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -1px;
      text-transform: uppercase;
    }
    
    .back-link {
      color: #ccc;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.4rem 0.8rem;
      transition: all 0.3s;
    }

    .back-link:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* --- MAIN CONTENT --- */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .page-header {
      margin-bottom: 3rem;
      border-left: 4px solid var(--primary);
      padding-left: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      text-transform: uppercase;
      font-weight: 900;
      line-height: 1.1;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    
    .subtitle {
      color: #888;
      font-size: 1rem;
      margin-top: 1rem;
      line-height: 1.5;
    }

    /* --- EVENT CARDS --- */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .event-card {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 1.5rem;
      width: 100%;
      position: relative;
    }

    .event-card.completed {
        border-color: #222;
        opacity: 0.7;
    }

    .event-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0.5rem 0;
      color: #fff;
      text-transform: uppercase;
      word-break: break-word;
    }

    .event-date {
      color: var(--primary);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .event-card.completed .event-date {
        color: var(--completed);
    }

    .event-details {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .status-tag {
        display: inline-block;
        font-size: 0.6rem;
        padding: 2px 8px;
        border: 1px solid var(--completed);
        color: var(--completed);
        text-transform: uppercase;
        font-weight: 900;
        margin-bottom: 0.5rem;
    }

    .join-btn {
      display: block;
      width: 100%;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      padding: 0.8rem;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      text-transform: uppercase;
    }

    .join-btn.disabled {
        border-color: #333;
        color: #555;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* --- DESKTOP ENHANCEMENTS --- */
    @media (min-width: 768px) {
      .container { padding: 6rem 2rem; }
      .event-card { padding: 2.5rem; }
      .event-title { font-size: 2rem; }
      .join-btn { width: auto; display: inline-block; padding: 0.8rem 2rem; }
      .logo { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-container">
      <a href="index.html" class="logo">#MECS</a>
      <a href="index.html" class="back-link">← Back</a>
    </nav>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>Upcoming Events</h1>
      <p class="subtitle">Join our live sessions, workshops, and community meetups to level up your security game.</p>
    </div>
    
    <div id="content-area"></div>
  </div>

  <script>
    // --- EVENT DATA CONTROL ---
    const events = [
      {
        date: "Forever",
        title: "TRACE: A 72 HOURS OSINT CHALLENGE",
        desc: "Everything you're Looking for is already Available",
        link: "https://makeeveryonecybersafe.github.io/CTF.html",
        completed: false 
      },
      {
        date: "MAR 10, 2026 • 09:00 AM IST",
        title: "Cyber Metaphors",
        desc: "A Triple Collab with MECSxAPEXxMr3DBlender, to promote Cyber Education in a unique way",
        link: "files/metaphors.pdf",
        completed: false 
      },
      {
        date: "FEB 22, 2026 • 09:00 AM IST",
        title: "MECS - SELF-AUDIT CHALLENGE 2K26",
        desc: "See yourself like an Hacker would.",
        link: "#",
        completed: true 
      },
      {
        date: "DEC 26, 2025 • 10:00 AM IST",
        title: "DECODING MODERN CYBER MYTHS",
        desc: "An interactive session breaking modern cyber myths and exposing how everyday online habits quietly compromise security.",
        link: "#",
        completed: true 
      },
    ];

    const contentArea = document.getElementById('content-area');

    if (events.length === 0) {
      contentArea.innerHTML = `
        <div class="empty-state">
          <div class="status-badge">● System Status: Idle</div>
          <div class="empty-icon">📡</div>
          <h2 style="margin-bottom:1rem; text-transform:uppercase;">No Signals</h2>
          <p style="color:#888; font-size:0.9rem; max-width:400px; margin:0 auto;">
            We are currently planning our next operation. Connect with our network for updates.
          </p>
          <a href="https://instagram.com/makeeveryonecybersafe" target="_blank" class="notify-btn">Follow For Updates</a>
        </div>
      `;
    } else {
      let html = '<div class="events-list">';
      events.forEach(event => {
        html += `
          <div class="event-card ${event.completed ? 'completed' : ''}">
            ${event.completed ? '<span class="status-tag">COMPLETED</span><br>' : ''}
            <span class="event-date">${event.date}</span>
            <h3 class="event-title">${event.title}</h3>
            <p class="event-details">${event.desc}</p>
            <a href="${event.link}" class="join-btn ${event.completed ? 'disabled' : ''}">
                ${event.completed ? 'SESSION ENDED' : 'Register →'}
            </a>
          </div>
        `;
      });
      html += '</div>';
      contentArea.innerHTML = html;
    }
  </script>
</body>
</html>
